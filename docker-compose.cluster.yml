networks:
  redisnet:
    name: redisnet
    driver: bridge

x-redis-environment: &redis-environment
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
  REDIS_MIN_REPLICAS_TO_WRITE: ${REDIS_MIN_REPLICAS_TO_WRITE:-1}
  REDIS_MIN_REPLICAS_MAX_LAG: ${REDIS_MIN_REPLICAS_MAX_LAG:-10}

x-redis-base: &redis-base
  image: thuongtruong1009/reluster:latest
  build:
    context: .
    dockerfile: ./configs/cluster/Dockerfile
  networks:
    - redisnet
  environment: *redis-environment
  healthcheck:
    test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  node-1:
    <<: *redis-base
    container_name: node-1
    hostname: node-1
    environment:
      <<: *redis-environment
      REDIS_HOST: node-1

  node-2:
    <<: *redis-base
    container_name: node-2
    hostname: node-2
    environment:
      <<: *redis-environment
      REDIS_HOST: node-2

  node-3:
    <<: *redis-base
    container_name: node-3
    hostname: node-3
    environment:
      <<: *redis-environment
      REDIS_HOST: node-3

  node-4:
    <<: *redis-base
    container_name: node-4
    hostname: node-4
    environment:
      <<: *redis-environment
      REDIS_HOST: node-4

  node-5:
    <<: *redis-base
    container_name: node-5
    hostname: node-5
    environment:
      <<: *redis-environment
      REDIS_HOST: node-5

  node-6:
    <<: *redis-base
    container_name: node-6
    hostname: node-6
    environment:
      <<: *redis-environment
      REDIS_HOST: node-6

  node-7:
    <<: *redis-base
    container_name: node-7
    hostname: node-7
    environment:
      <<: *redis-environment
      REDIS_HOST: node-7

  benchmark:
    image: thuongtruong1009/reluster-bench:latest
    container_name: benchmark
    build:
      context: .
      dockerfile: ./configs/cluster/Dockerfile.bench
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_HOST=node-1
    networks:
      - redisnet
    volumes:
      - ./benchmark-results:/results
    restart: "no"
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5
      - node-6
