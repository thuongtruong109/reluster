x-redis-environment: &redis-environment
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
  REDIS_MASTER_HOST: ${REDIS_MASTER_HOST:-172.28.0.10}
  REDIS_SENTINEL_HOSTS: sentinel_1:26379,sentinel_2:26379,sentinel_3:26379
  REDIS_SENTINEL_MASTER_NAME: mymaster
  REDIS_SENTINEL_DISCOVERY_TIMEOUT: ${REDIS_SENTINEL_DISCOVERY_TIMEOUT:-15}

x-redis-common: &redis-common
  build:
    context: .
    dockerfile: ./configs/ha/replica/Dockerfile
  image: thuongtruong1009/reluster-replica
  restart: always
  environment: *redis-environment
  volumes:
    - ./configs/ha/replica/redis.conf:/etc/redis/redis.conf.template:ro

x-sentinel-common: &sentinel-common
  build:
    context: .
    dockerfile: ./configs/ha/sentinel/Dockerfile
  image: thuongtruong1009/reluster-sentinel
  restart: always
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    REDIS_MASTER_HOST: ${REDIS_MASTER_HOST:-172.28.0.10}
  depends_on:
    - redis-master

services:
  redis-master:
    <<: *redis-common
    container_name: redis-master
    environment:
      <<: *redis-environment
      REDIS_BOOTSTRAP_ROLE: master
      REDIS_NODE_HOST: ${REDIS_MASTER_HOST:-172.28.0.10}
    ports:
      - "6379:6379"
    networks:
      redisnet:
        ipv4_address: ${REDIS_MASTER_HOST:-172.28.0.10}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  slave_1:
    <<: *redis-common
    container_name: slave_1
    environment:
      <<: *redis-environment
      REDIS_BOOTSTRAP_ROLE: replica
      REDIS_NODE_HOST: 172.28.0.11
    ports:
      - "6380:6379"
    networks:
      redisnet:
        ipv4_address: 172.28.0.11
    depends_on:
      - redis-master

  slave_2:
    <<: *redis-common
    container_name: slave_2
    environment:
      <<: *redis-environment
      REDIS_BOOTSTRAP_ROLE: replica
      REDIS_NODE_HOST: 172.28.0.12
    ports:
      - "6381:6379"
    networks:
      redisnet:
        ipv4_address: 172.28.0.12
    depends_on:
      - redis-master

  slave_3:
    <<: *redis-common
    container_name: slave_3
    environment:
      <<: *redis-environment
      REDIS_BOOTSTRAP_ROLE: replica
      REDIS_NODE_HOST: 172.28.0.13
    ports:
      - "6382:6379"
    networks:
      redisnet:
        ipv4_address: 172.28.0.13
    depends_on:
      - redis-master

  sentinel_1:
    <<: *sentinel-common
    container_name: sentinel_1
    ports:
      - "26379:26379"
    networks:
      redisnet:
        ipv4_address: 172.28.0.20

  sentinel_2:
    <<: *sentinel-common
    container_name: sentinel_2
    ports:
      - "26380:26379"
    networks:
      redisnet:
        ipv4_address: 172.28.0.21

  sentinel_3:
    <<: *sentinel-common
    container_name: sentinel_3
    ports:
      - "26381:26379"
    networks:
      redisnet:
        ipv4_address: 172.28.0.22

networks:
  redisnet:
    name: ${REDIS_NETWORK:-redisnet}
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
