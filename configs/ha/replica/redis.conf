port 6379
bind 0.0.0.0
dir /data
protected-mode yes
requirepass ${REDIS_PASSWORD}
masterauth ${REDIS_PASSWORD}
replica-announce-ip ${REDIS_NODE_HOST}
replica-announce-port 6379
min-replicas-to-write ${REDIS_MIN_REPLICAS_TO_WRITE}
min-replicas-max-lag ${REDIS_MIN_REPLICAS_MAX_LAG}
appendonly yes

# The startup entrypoint appends replicaof only after resolving the current
# topology from Sentinel. Do not place a static replicaof directive here.
