services:
  console:
    build:
      context: ./apps/console
      dockerfile: api/Dockerfile
    image: reluster-console:local
    container_name: reluster-console
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SENTINEL_PASSWORD: ${SENTINEL_PASSWORD:-}
      CONSOLE_WRITE_ENABLED: ${CONSOLE_WRITE_ENABLED:-true}
      CONSOLE_FAILOVER_ENABLED: ${CONSOLE_FAILOVER_ENABLED:-false}
      CONSOLE_KEY_PREFIX: ${CONSOLE_KEY_PREFIX:-demo:}
      CONSOLE_CLUSTER_NODES: node-1:6379,node-2:6379,node-3:6379,node-4:6379,node-5:6379,node-6:6379
      CONSOLE_SENTINEL_NODES: sentinel_1:26379,sentinel_2:26379,sentinel_3:26379
      CONSOLE_SENTINEL_MASTER: mymaster
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8080}:8080"
    networks:
      - redisnet

  commander:
    image: rediscommander/redis-commander:latest
    container_name: commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: ${COMMANDER_REDIS_HOSTS:-}
    ports:
      - "8081:8081"
    networks:
      - redisnet

  exporter:
    image: oliver006/redis_exporter:v1.50.0
    container_name: exporter
    networks:
      - redisnet
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_ADDR: "node-1:6379,node-2:6379,node-3:6379,node-4:6379,node-5:6379,node-6:6379"
      REDIS_CLUSTER_MODE: "true"
    ports:
      - "9121:9121"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9121/metrics"]
      interval: 15s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    networks:
      - redisnet
    volumes:
      - ./tools/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    networks:
      - redisnet
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - ./tools/grafana/data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  redisnet:
    external: true
    name: ${REDIS_NETWORK:-redisnet}
